<!doctype html><meta charset=utf-8><link rel=stylesheet href="../fonts.css">
<body style="margin:0;background:#111;display:flex;flex-wrap:wrap;gap:6px;padding:6px;font:11px monospace;color:#aaa">
<script type=module>
import * as R from "../render.js";
const faces = ['italic 20px "Instrument Serif"','20px "Instrument Serif"','500 20px "Space Grotesk"','600 20px "Space Grotesk"','400 20px "DM Mono"','800 20px "Unbounded"','20px "Anton"','200 20px "Antonio"','700 20px "Antonio"','20px "Bebas Neue"','150 20px "Big Shoulders Display"','300 20px "Big Shoulders Display"','20px "Six Caps"','20px "Yellowtail"','500 20px "Caveat"'];
await Promise.all(faces.map(f => document.fonts.load(f)));
const q = new URLSearchParams(location.search);
const d = new Date(2026,10,7,2,30,50);
const mode = q.get("mode") || "scenes", o = Number(q.get("o")||0);
const list = mode === "scenes" ? R.SCENE_STYLES.map((s,i) => ({ clock: R.TYPE_STYLES[(i+o)%12].id, bg: s.id, pal: "a"+(i+o), seed: "b"+(i+o), pos: "middle" }))
  : R.TYPE_STYLES.map((t,i) => ({ clock: t.id, bg: R.SCENE_STYLES[(i+o)%8].id, pal: "c"+(i+o), seed: "e"+(i+o), pos: "middle" }));
for (const s of list) {
  const c = document.createElement("canvas"); c.width = 300; c.height = 650; c.style.width = "200px";
  const f = document.createElement("figure"); f.style.margin = 0; f.append(c, Object.assign(document.createElement("div"), { textContent: `${s.clock} / ${s.bg} / ${s.pal}` }));
  document.body.append(f);
  const t0 = performance.now(); R.renderAll(c.getContext("2d"), 300, 650, s, d); console.log(s.bg, s.clock, Math.round(performance.now()-t0));
}
document.title = "done";
</script>
