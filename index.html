<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Paruto Apps</title>
  <meta name="description" content="A showcase of the apps being built by Paruto.">
  <meta name="theme-color" content="#060608">
  <meta property="og:title" content="Paruto Apps">
  <meta property="og:description" content="A showcase of the apps being built by Paruto.">
  <meta property="og:type" content="website">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <!-- Apple devices use SF Pro / SF Mono via the system stack; these are the fallbacks elsewhere -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <!-- Fonts load without holding up the first paint (the system stack shows until they arrive) -->
  <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Geist:wght@300..700&family=Geist+Mono:wght@400;500&family=Instrument+Serif:ital@0;1&display=swap" onload="this.onload=null;this.rel='stylesheet'">
  <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@300..700&family=Geist+Mono:wght@400;500&family=Instrument+Serif:ital@0;1&display=swap"></noscript>
  <!-- Everything on the page comes from apps.json: fetch it straight away, with the script -->
  <link rel="preload" href="apps.json" as="fetch" crossorigin="anonymous">
  <link rel="preload" href="app.js" as="script">
  <link rel="stylesheet" href="styles.css">
  <script>
    // Dark by default; apply a saved light preference before first paint (no flash)
    try { if (localStorage.getItem("theme") === "light") document.documentElement.dataset.theme = "light"; } catch {}
  </script>
</head>
<body>
  <div class="grain" aria-hidden="true"></div>

  <!-- Floating Liquid Glass nav; compacts while scrolling down -->
  <header class="nav glass" id="nav">
    <a class="brand" href="#top" aria-label="Home">
      <span class="mark" aria-hidden="true"></span>
      <span id="brandName">Paruto Apps</span>
    </a>
    <nav class="nav-links" aria-label="Primary">
      <a href="#atrium">Apps</a>
      <a href="#index">Index</a>
      <a href="#files">Files</a>
    </nav>
    <div class="nav-end">
      <button class="theme-toggle" id="themeToggle" type="button" aria-label="Switch to light mode">
        <svg class="i-sun" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><g fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2M12 19.5v2M4.6 4.6l1.4 1.4M18 18l1.4 1.4M2.5 12h2M19.5 12h2M4.6 19.4 6 18M18 6l1.4-1.4"/></g></svg>
        <svg class="i-moon" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5Z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>
      </button>
      <a class="nav-cta" id="contactLink" href="#contact">Contact</a>
    </div>
  </header>

  <main id="top">
    <!-- (01) Atrium: every app on a slowly turning ring, lit from above -->
    <section class="atrium" id="atrium" aria-labelledby="headline">
      <div class="at-light" aria-hidden="true"></div>
      <div class="at-copy">
        <p class="at-eyebrow mono"><span class="pulse" aria-hidden="true"></span><span id="eyebrow"></span> · <span id="eyebrowCount"></span></p>
        <h1 id="headline"></h1>
      </div>
      <div class="ring-stage" id="ringStage" tabindex="0" role="group" aria-roledescription="carousel" aria-label="Apps. Drag, swipe or use the arrow keys to turn; Enter opens the app in front.">
        <div class="ring" id="ring"></div>
        <div class="floor" aria-hidden="true"></div>
      </div>
      <div class="at-now" id="now" aria-live="polite"></div>
      <div class="at-controls">
        <button class="round glass" id="prev" type="button" aria-label="Turn to the previous app"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg></button>
        <span class="at-pos mono" id="pos"></span>
        <button class="round glass" id="next" type="button" aria-label="Turn to the next app"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg></button>
      </div>
    </section>

    <!-- (02) Index: every app in big type; a picture follows the pointer -->
    <section class="index wrap" id="index" aria-labelledby="indexTitle">
      <header class="ix-head">
        <p class="label mono">(02) Index</p>
        <h2 id="indexTitle">The full <em>list</em>.</h2>
      </header>
      <ol class="ix" id="ix"></ol>
    </section>

    <!-- (03) Files: unannounced projects, redacted until opened -->
    <section class="files wrap" id="files" aria-labelledby="filesTitle" hidden>
      <header class="ix-head">
        <p class="label mono">(03) Files</p>
        <h2 id="filesTitle">Classified, for <em>now</em>.</h2>
        <p class="fl-lead">Projects we can't name yet. Open a file to read the parable it was given.</p>
      </header>
      <ol class="fl" id="fl"></ol>
    </section>
  </main>

  <footer class="footer wrap" id="contact">
    <div class="cta panel">
      <p class="label mono">(04) Contact</p>
      <h2>Have an idea? Let's <em>talk</em>.</h2>
      <a class="footer-email" id="footerEmail" href="#"></a>
    </div>
    <nav class="family" id="family" aria-labelledby="familyTitle" hidden>
      <p class="label mono" id="familyTitle">The Paruto family</p>
      <ul class="family-links" id="familyLinks"></ul>
    </nav>
    <div class="wordmark" id="wordmark" aria-hidden="true"></div>
    <div class="footer-bottom mono">
      <span id="footerText"></span>
      <a href="#top">Back to top ↑</a>
    </div>
  </footer>

  <!-- A picture that follows the pointer over the index -->
  <div class="follow" id="follow" aria-hidden="true"><img alt=""></div>

  <!-- An app up close: a sheet from the side (a bottom sheet on phones) -->
  <div class="scrim" id="scrim" hidden></div>
  <aside class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle" hidden>
    <button class="round glass sheet-close" id="sheetClose" type="button" aria-label="Close"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
    <div class="sheet-scroll" id="sheetScroll"></div>
  </aside>

  <!-- Lightbox for an app's screenshots -->
  <div class="lightbox" id="lightbox" hidden role="dialog" aria-modal="true" aria-label="Image viewer">
    <button class="lb-btn glass lb-close" data-lb-close aria-label="Close">
      <svg viewBox="0 0 24 24" width="18" height="18"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" d="M6 6l12 12M18 6 6 18"/></svg>
    </button>
    <button class="lb-btn glass lb-prev" id="lbPrev" aria-label="Previous">
      <svg viewBox="0 0 24 24" width="18" height="18"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M15 6l-6 6 6 6"/></svg>
    </button>
    <figure id="lbFigure"></figure>
    <button class="lb-btn glass lb-next" id="lbNext" aria-label="Next">
      <svg viewBox="0 0 24 24" width="18" height="18"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M9 6l6 6-6 6"/></svg>
    </button>
    <p class="lb-count mono" id="lbCount"></p>
  </div>

  <script src="app.js"></script>
</body>
</html>
