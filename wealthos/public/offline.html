<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Offline · WealthOS</title>
<style>
  :root { color-scheme: light dark; --bg: #f6f3ec; --text: #1b1f1c; --muted: #4b524d; --brand: #12392b; }
  @media (prefers-color-scheme: dark) { :root { --bg: #0c1310; --text: #edf1ec; --muted: #b8c2bb; --brand: #cfe8da; } }
  body { margin: 0; min-height: 100dvh; display: grid; place-items: center; background: var(--bg); color: var(--text); font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { max-width: 22rem; padding: 2rem 1.25rem; text-align: center; }
  h1 { font-size: 1.4rem; margin: 1rem 0 .5rem; color: var(--brand); }
  p { color: var(--muted); margin: 0 0 1.25rem; }
  a.btn { display: inline-block; padding: .6rem 1.1rem; border-radius: 999px; background: #12392b; color: #f6f3ec; text-decoration: none; }
</style>
</head>
<body>
<main>
  <img src="/icons/icon.svg" width="56" height="56" alt="">
  <h1>You're offline</h1>
  <p>WealthOS doesn't keep copies of your financial information on this device, so it needs a connection to show it.</p>
  <a class="btn" href="/dashboard">Try again</a>
</main>
</body>
</html>
