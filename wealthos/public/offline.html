<!doctype html>
<html lang="en">
<head>

<style>

  body { margin: 0; min-height: 100dvh; display: grid; place-items: center; background: var(--bg); color: var(--text); font: 17px/1.47 -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, "Segoe UI", sans-serif; letter-spacing: -0.02em; -webkit-font-smoothing: antialiased; }

  p { color: var(--muted); margin: 0 0 1.25rem; }
  a.btn { display: inline-block; padding: .65rem 1.4rem; border-radius: 999px; background: #f5f5f7; color: #060608; text-decoration: none; font-size: 15px; font-weight: 500; }
</style>
</head>
<body>
<main>
  <img src="/icons/icon-192.png" width="64" height="64" alt="">
