  <style>
    /* Same tokens as styles.css: dark editorial base, SF stack, Instrument Serif accent, capsule buttons */
    :root {
      --bg: #060608; --panel: #0b0b0e; --line: rgba(255, 255, 255, 0.075); --line-2: rgba(255, 255, 255, 0.14);
      --text: #f5f5f7; --muted: #98989f; --faint: #5a5a62;
      --sans: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Geist", ui-sans-serif, system-ui, "Segoe UI", sans-serif;
      --mono: ui-monospace, "SF Mono", "Geist Mono", SFMono-Regular, Menlo, monospace;
      --serif: "Instrument Serif", "New York", ui-serif, Georgia, serif;
      --spring: cubic-bezier(0.34, 1.4, 0.64, 1);
      color-scheme: dark;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; background: var(--bg); color: var(--text); font-family: var(--sans); -webkit-font-smoothing: antialiased; }
    main { min-height: 100vh; min-height: 100dvh; display: grid; place-items: center; padding: 32px clamp(16px, 4vw, 48px); }
    .card { width: 100%; max-width: 620px; border: 1px solid var(--line); border-radius: clamp(24px, 2.6vw, 34px); background: var(--panel); padding: clamp(28px, 6vw, 56px); display: grid; gap: 20px; box-shadow: 0 60px 120px -50px rgba(0, 0, 0, 0.9); }
    .code { font-family: var(--mono); font-size: 13px; letter-spacing: .08em; color: var(--muted); }
    h1 { margin: 0; font-size: clamp(36px, 7vw, 60px); line-height: 1.02; letter-spacing: -0.03em; font-weight: 600; text-wrap: balance; }
    h1 em { font-family: var(--serif); font-style: italic; font-weight: 400; letter-spacing: -0.01em; }
    p { margin: 0; color: var(--muted); font-size: 17px; line-height: 1.5; max-width: 46ch; }
    .actions { display: flex; flex-wrap: wrap; gap: 10px; padding-top: 4px; }
    a.btn { display: inline-flex; align-items: center; min-height: 44px; padding: 0 20px; border-radius: 999px; font-weight: 600; font-size: 15px; text-decoration: none; transition: transform .35s var(--spring); }
    a.btn:hover { transform: translateY(-1px) scale(1.02); }
    a.btn:focus-visible { outline: 2px solid var(--text); outline-offset: 3px; }
    .primary { background: var(--text); color: var(--bg); }
    .secondary { border: 1px solid var(--line-2); color: var(--text); }
    @media (prefers-reduced-motion: reduce) { a.btn { transition: none; } }
  </style>
</head>

      <div class="actions">
        <a class="btn primary" href="/">See all apps</a>
        <a class="btn secondary" href="/games/anansi-swing-city/">Play Anansi: Swing City</a>
      </div>
    </div>
  </main>
</body>
</html>
